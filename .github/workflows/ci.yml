name: ProbeKV local correctness

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements/ci.txt

      - name: Compile
        run: python -m compileall -q src scripts tests

      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v

      - name: Validate frozen contract
        run: |
          python scripts/validate_contract.py \
            --contract configs/experiment_contract.yaml \
            --output artifacts/ci/contract.json

      - name: Exercise deterministic system path
        run: |
          python -m probekv simulate \
            --config configs/local_smoke.json \
            --output artifacts/ci/simulation
