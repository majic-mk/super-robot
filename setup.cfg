[metadata]
name = probekv
version = 0.1.0
description = Current-early-state-guided safe-cost selection among historical KV variants
long_description = file: README.md
long_description_content_type = text/markdown
license = Research-only

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.8

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    probekv = probekv.cli:main
