[metadata]
name = probekv
version = 0.1.0
description = Current-state-guided historical KV source selection research harness
long_description = file: README.md
long_description_content_type = text/markdown
license = Research-only

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.8

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    probekv = probekv.cli:main
