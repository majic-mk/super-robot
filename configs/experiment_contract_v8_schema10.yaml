protocol_version: 8
schema_version: 10
stage: no_gpu_dynamic_variant_growth_and_gate1_counterfactual
runtime_patch_mode: probekv_v8_variant_growth_counterfactual

source_selection:
  method: training_free_current_state_residual_k
  online_depths_mistral: [1, 2, 4, 5, 8]
  online_depths_qwen: [1, 2, 4, 5, 7]
  source_residual_trim_ratio_candidates: [0.10, 0.15, 0.20, 0.25, 0.30]
  absolute_threshold_key: [model, completed_depth, source_residual_trim_ratio]
  absolute_residual_admission_required: true
  source_freeze_is_final: true

variant_admission:
  profile: VariantAdmissionProfile
  canonical_provenance: DENSE_EXACT_CANONICAL
  maturity_states: [PROBATION, VERIFIED, EXPIRED]
  lifecycle_states: [ACTIVE, RETIRED, EVICTED]
  content_miss_materialization: true
  complete_scope_absolute_mismatch_materialization: true
  budget_truncated_exploration_materialization: true
  budget_truncated_exploration_sets_no_compatible_stored_variant_proven: false
  exploration_replacement_at_k16: false
  max_variants_per_content: 16
  replacement_policy: per_content_variant_lru_full_scope_only
  replacement_budget_fraction: 0.01
  exploration_quota_per_content: 2
  verification_comparisons: 2
  probation_grace_lookup_opportunities: 2
  probation_grace_capacity_per_content: 2
  post_grace_policy: ordinary_per_content_lru
  selective_repair_promotion: false
  r1_repair_promotion: false

preparation:
  profile: PreparationPolicyProfile
  gate1_modes: [explicit_barrier, fused_advisory]
  gate1_decision_basis: counterfactual_wasted_preparation
  atomic_preparation_reservation_required: true
  final_commit_admission_required: true
  final_commit_gamma: 0.8
  paired_ab_anchors_per_model: 18
  paired_ab_datasets: [musique, 2wikimultihopqa, hotpotqa]

profile_freeze:
  development_request_units_per_model: 90
  development_case_manifest_sha256_required: true
  freezes_quality_tail_rate_1pct: false
  order:
    - reference_runtime
    - selection_depth_profile
    - variant_admission_profile
    - repair_policy_profile
    - runtime_cost_profile
    - preparation_policy_profile
    - final_consistency
  reference_path:
    repair_policy: fixed_15
    gate1_mode: explicit_barrier
    final_commit_gamma: 0.8
  repair_ratio_grid: [0.10, 0.12, 0.15, 0.20, 0.30, 0.50, 0.75, 1.00]
  runtime_cost_factorized: true
  runtime_cost_cartesian_product: false
  joint_anchor_segments: [1, 5, 37]
  profile_job_shard_cases: 6

quality_certification:
  separate_from_profile: true
  unique_request_units_per_model_minimum: 300
  runtime_qualification_rows_are_not_quality_units: true

coverage:
  k_values: [1, 2, 4, 8, 16]
  operational_requires_causal_trace_replay: true
  future_variant_visibility: false
  oracle_is_explicit_upper_bound: true

materialization_metrics:
  stored_pool_mismatch_precision_full_candidate_only: true
  exploration_yield_window: 32
  useful_materialization_precision_window: 32
  track_write_amplification: true

growth_experiment:
  initial_k: 1
  maximum_k: 16
  policies:
    - single_variant_no_growth
    - complete_mismatch_growth_only
    - schema10_controlled_exploration
    - deep_oracle_growth

compatibility:
  schema9_profiles_unlock_schema10: false
  schema9_gates_unlock_schema10: false
  schema9_results_read_only: true
  locked_test_accessed: false
  paper_evidence: false

no_gpu_gate:
  schema10_local_implementation_complete: true
  artifact_preparation_ready: true
  gpu_rental_ready_for_schema10_profile_freeze: true
  variant_admission_profile_frozen: false
  preparation_policy_profile_frozen: false
  selection_depth_profile_frozen: false
  repair_policy_profile_frozen: false
  runtime_cost_profile_frozen: false
  gpu_runtime_qualified: false
  h1_h2_execution_allowed: false
  failures: []
