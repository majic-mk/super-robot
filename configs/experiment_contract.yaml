schema_version: 6
project: ProbeKV
core_claim: >-
  target-model current-early-state-guided selection among multiple canonical
  historical KV variants of the same exact non-prefix segment, using
  variant-specific conservative safe total-reuse cost bounds and abstention
frozen_at: 2026-07-26
amended_at: 2026-08-01
amendment_note: >-
  Following the pre-experiment design review, every layer through the 25%
  ceiling is the main probe policy. The original sparse checkpoints remain a
  mandatory overhead ablation. A 2026-07-27 prior-art audit also narrowed the
  claim because Cache-Craft already stores and selects multiple cache variants;
  multi-version selection, dynamic repair ratios, prefetch and scheduling are
  not claimed independently. The Cache-Craft parity correction requires the
  controlled current and historical prefixes to be independently constructed
  with unequal natural lengths; the question remains after retrieved chunks.
  Natural corpus traces are not filtered solely for equal token counts. No test
  result motivated these amendments. Before any formal server performance data
  was collected, the provisioned NVIDIA A800-SXM4-80GB was frozen as the
  matched primary hardware for ProbeKV and every same-stack baseline. Before
  H1 runtime or any formal H2 data, version 3 separated Source selection from
  final reuse admission, retained strict interval selection for reproduction,
  added explicit final economic selector policies, made scheduler work atomic,
  and required complete expected-job accounting before publication evidence.
  Protocol version 4, frozen before the next GPU run, makes actual
  load/scheduler feedback a mandatory input to final reuse admission, adds
  independent selection/admission states, preserves selector abstention as a
  direct full-recompute path, and defines auditable Source version/replica
  lifecycle policies. It also corrects arbitrary-query causal masking in the
  CacheBlend compatibility patch and preserves post-C retrieved chunks as the
  current-only suffix. Version 3 remains reproducible and is not silently
  reinterpreted.
  Protocol version 5, frozen before GPU performance experiments, preserves
  checkpoint-level early Source selection while requiring preliminary and
  refined decisions to instantiate the same component cost identity. The
  Source selected during probe is locked; refined admission can only accept
  reuse or reject it and run full recomputation.
  Protocol version 6 is a new, explicit protocol and does not reinterpret v3-v5
  artifacts. It replaces the legacy per-request Kmax rule with a global pool of
  up to 16 canonical variants per retained content, plans every detected exact
  non-prefix segment, compares summaries only within a request-level 5% budget,
  and performs multi-segment partial reuse through one actual common boundary.
  Selection, per-segment admission, and request execution mode remain separate.

invariants:
  canonical_source_origin: full_prefill
  promote_selective_repair: false
  prefix_cache_precedence: true
  require_current_historical_context_distinct: true
  user_question_position: after_retrieved_chunks
  online_kmax: 4  # legacy v3-v5 only; forbidden in v6 configuration files
  offline_k: [1, 2, 4, 8]  # legacy v3-v5
  default_gamma: 0.8
  gamma_ablation: [0.6, 0.7, 0.8, 0.9]
  max_probe_fraction: 0.25
  legacy_force_selection_at_probe_max: false
  legacy_selected_source_none_implies_reuse_rejected: true
  selected_source_none_implies_reuse_forbidden: true
  full_recompute_implies_no_admission_accepted: true
  selector_abstention_forbids_source_loading: true
  scheduler_feedback_precedes_final_admission: true
  selected_source_locked_before_loading: true
  refined_admission_cannot_reselect_source: true
  preliminary_and_refined_share_cost_identity: true
  cacheblend_case_runner_is_not_online_runtime: true
  cacheblend_closed_loop_requires_layer_resumption: true
  rejected_loaded_source_bytes_are_audited: true

protocol_versions:
  v3_reproduction:
    closed_loop_policy: legacy_pre_schedule_admission
  v4_main:
    closed_loop_policy: two_stage_refined_admission
    final_admission_inputs:
      - actual_reuse_boundary
      - source_ready_ms
      - scheduled_step_finish_ms
      - a_resume_ms
      - post_ready_blocking_ms
      - measured_load_and_interference
      - refined_repair_and_full_time
  v5_main:
    closed_loop_policy: two_stage_refined_admission
    cost_accounting_policy: unified_components_v1
    cost_origin: request_arrival
    cost_endpoint: first_token_ready
    early_checkpoint_selection_preserved: true
    selected_source_locked_during_refinement: true
    interference_accounting_mode: included_in_load
    refined_cost_value_kind: refined_actual_past_profiled_future
    runtime_backend: cacheblend_closed_loop
    required_runtime_capabilities:
      - async_source_loading
      - layer_resumable_prefill
      - scheduler_feedback
      - boundary_conditioned_profiles
      - canonical_sources_read_only
      - cuda_event_timing
  v6_main:
    supersedes_protocol_for_new_experiments: v5_main
    runtime_backend: cacheblend_multisegment_closed_loop
    legacy_online_kmax_forbidden: true
    prefix_cache_precedence: true
    max_stored_variants_per_content: 16
    min_variants_per_retained_content: 1
    candidate_compare_policy: all_within_request_budget
    max_compared_variants_per_segment: 16
    k_ablation: [1, 2, 4, 8, 16]
    probe_metadata_compare_budget_fraction: 0.05
    segment_planning_policy: all_exact_nonprefix
    max_detected_segments: null
    boundary_policy: common
    partial_reuse_enabled: true
    joint_quality_policy: simultaneous_conformal
    interference_accounting_mode: explicit_penalty
    source_pool_policy: global_hard_model_soft
    source_eviction_policy: value_density_v1
    cachecraft_eviction_baseline: cache_craft_fr
    source_lock_precedes_loading: true
    scheduler_feedback_precedes_refined_admission: true
    scheduler_source_feedback:
      - source_load_start_ms
      - source_load_finish_ms
      - source_ready_ms
      - layer_ready_ms
      - transferred_bytes
      - wasted_bytes
    request_scheduler_feedback:
      - scheduled_step_finish_ms
      - a_resume_ms
      - post_ready_blocking_ms
      - load_interference_ms
      - useful_a_dense_ms
      - useful_other_request_work_ms
    no_source_selection_implies_direct_dense: true
    comparison_complexity: sum_per_segment_candidates
    forbidden_comparison_complexity: cartesian_source_combinations
    correctness_grid:
      segment_counts: [1, 2, 5, 10]
      variant_counts: [1, 4, 16]
    multisegment_pilot:
      segment_counts: [5, 10, 15]
      hit_regimes: [all_hit, partial_hit, all_miss]

probe_policy:
  objective: earliest_calibrated_safe_and_economical_decision
  legacy_policy: strict_interval
  formal_candidate_policy: final_economic_min_cost
  ablation_policy: final_economic_max_reuse
  final_selection_requires_quality_coverage: true
  final_selection_requires_predicted_gamma_admission: true
  v4_preliminary_economic_filter_at_every_checkpoint: true
  v5_early_checkpoint_selection_preserved: true
  final_max_reuse_tolerance: 0.02
  final_timing_rejection_retains_selected_source: true
  main_32_layer_checkpoints: [1, 2, 3, 4, 5, 6, 7, 8]
  sparse_ablation_32_layer_checkpoints: [1, 2, 4, 6, 8]
  full_layer_scan_pilot_fraction: 0.20
  full_layer_scan_is_online_policy: false
  no_go_if_reliable_only_beyond_ceiling: true
  checkpoint_cost_must_be_measured_separately: true

repair_policy:
  ratio_unit: recomputed_segment_tokens_over_segment_tokens_per_active_layer
  token_ranking: cacheblend_v_drift_within_segment_c
  nonendpoint_token_count: floor_ratio_times_segment_tokens
  nested_topn_sets_required: true
  safe_label_requires_all_higher_tested_ratios_to_pass: true
  report_effective_token_layer_work_ratio: true

cachecraft_fairness:
  same_case_and_source_manifest: true
  same_token_repair_ordering: true
  same_repair_backend: true
  same_cost_admission_prefetch_scheduler: true
  only_source_selector_differs: true

repair_ratios: [0.0, 0.05, 0.10, 0.16, 0.20, 0.30, 0.50, 0.75, 1.0]
reuse_layer_fractions: [0.10, 0.15, 0.22, 0.30, 0.40]
profile_segment_tokens: [256, 512, 1024, 2048, 4096, 8192]
main_segment_tokens: [512, 1024, 2048, 4096]
concurrency: [1, 2, 4, 8, 16]
seeds: [20260726, 20260727, 20260728]

hardware:
  primary:
    role: formal_matched_primary
    gpu_name_regex: "^NVIDIA A800.*80GB$"
    gpu_count: 1
    minimum_memory_mib: 80000
    compute_capability: "8.0"
  optional_portability:
    gpu_name_regex: "^NVIDIA A100.*80GB$"
    paper_tables_required: false
  matched_hardware_required_for_all_direct_baselines: true

models:
  primary:
    - mistralai/Mistral-7B-Instruct-v0.3
    - meta-llama/Llama-3.1-8B-Instruct
  auxiliary:
    - Qwen/Qwen2.5-7B-Instruct
  local_correctness:
    - Qwen/Qwen2.5-1.5B-Instruct

datasets:
  rag:
    - name: MuSiQue
      train: 150
      calibration: 100
      locked_test: 200
    - name: 2WikiMultiHopQA
      train: 150
      calibration: 100
      locked_test: 200
    - name: HotPotQA
      train: 150
      calibration: 100
      locked_test: 200
  controlled_cases: 200
  agent:
    name: GSM8K
    agents: 4
    calibration: 200
    locked_test: 300

quality:
  case_task_drop_max: 0.10
  token_f1_min: 0.90
  noninferiority_margin_points: 1.0
  tail_violation_upper_bound: 0.01
  tail_gate_scope: pooled_three_rag_datasets_per_model
  note: >-
    A per-dataset n=200 test cannot establish a one-sided 95% upper bound
    below 1% with zero observed violations. The formal tail gate is therefore
    pre-registered on the pooled 600 RAG cases per model; per-dataset estimates
    remain descriptive. Alternatively increase every dataset to at least 299
    for the exact one-sided Clopper-Pearson bound with zero violations.

selectors:
  - random
  - latest
  - single_source
  - cache_craft_style_cfo
  - raw_drift_argmin
  - calibrated_repair_cost
  - probekv_combined
  - oracle

features:
  - metadata_only
  - k_only_pre_rope
  - v_only
  - hidden_only
  - current_query
  - k_v_hidden
  - current_state_plus_metadata

prefetch:
  policies: [P0, P1, P2, P3, P4, Dynamic]
  dynamic_inputs:
    - selection_prior
    - source_bytes
    - storage_tier
    - free_hbm
    - bus_occupancy
    - concurrency

scheduler:
  policies:
    - no_overlap
    - a_only
    - b_only
    - hybrid
    - hybrid_strict
    - hybrid_bounded_overrun
  hybrid_extra_dense_budgets: [0, 1, 2, 4]
  source_ready_promotes_request: true
  cancel_at_economic_boundary: true
  atomic_dense_or_microbatch_steps: true
  strict_post_ready_overrun_ms: 0.0
  bounded_overrun_ms_ablation: [0.0, 0.5, 1.0, 2.0]
  charge_post_ready_blocking_to_request_a: true
  report_useful_other_request_work: true
  load_interference_must_be_explicit: true

source_lifecycle:
  canonical_identity: [model_signature, content_hash, source_id]
  online_version_policy: fifo_unleased
  h1_pilot_policy: fixed_resident_four_sources
  replica_policy: byte_aware_lru_unleased
  selector_signals_may_affect_eviction: false  # legacy v3-v5
  eviction_events_required: true
  v6:
    canonical_identity: [model_signature, content_hash, source_id]
    global_hard_tier_capacities: true
    model_soft_quotas: true
    value_density_factors: [p_hit, p_select, p_admit, expected_saved_ms, resident_bytes]
    selector_and_admission_statistics_affect_eviction: true
    probation_observations: 2
    eviction_order:
      - unleased_low_value_gpu_replica
      - unleased_low_value_cpu_or_ssd_replica
      - redundant_variant
      - whole_low_value_content
    busy_sources_protected: [leased, copy_in_flight, execution_in_flight]
    model_namespace_states: [ACTIVE, DRAINING, RETIRED, PURGING, DELETED]
    selective_repair_promotion: false

multisegment_policy:
  ordered_region_types: [PREFIX_EXACT, REUSE_CANDIDATE, DENSE, MANDATORY_SUFFIX]
  one_locked_winner_loaded_per_segment: true
  common_actual_reuse_boundary: true
  request_execution_modes: [ALL_REUSE, PARTIAL_REUSE, FULL_RECOMPUTE]
  per_segment_repair_ratios: true
  union_repair_mask_uses_absolute_positions: true
  all_ratios_one_must_equal_dense_output: true

statistics:
  bootstrap_iterations: 10000
  unit: case_or_segment_group
  multiple_testing: Holm-Bonferroni
  paired_effect_size: Hodges-Lehmann
  tail_interval: one-sided exact Clopper-Pearson
  delete_performance_outliers: false

gates:
  H0:
    rope_relative_error_max: 1.0e-5
    greedy_full_exact: true
    cacheblend_quality_drop_points_max: 1.0
  H1:
    min_fraction_spread_ge_10pp: 0.25
    oracle_k4_cost_reduction_min: 0.10
  H2:
    cachecraft_regret_gap_min: 0.05
    regret_reduction_min: 0.20
    accepted_by_19pct_layers_min: 0.80
    probe_compare_full_ttft_max: 0.05
  H3:
    noninferiority_lower_ci_min: -0.01
    tail_upper_ci_max: 0.01
  H4:
    admitted_reuse_over_full_max: 0.8
  H5:
    q1_ttft_min: 0.10
    q1_throughput_min: 0.10
    q1_p95_ttft_min: 0.05
    q2_range: [0.05, 0.10]
    stop_below: 0.03

stacks:
  primary:
    repository: https://github.com/YaoJiayi/CacheBlend
    commit: b72d7945e6d6306f12be66520196e0f081fa2b0c
    vllm: 0.4.1
    pytorch: 2.2.1
    xformers: 0.0.25
    cuda: "12.1"
  compatibility_smoke:
    vllm: 0.25.1

evidence_policy:
  local_simulation_is_paper_evidence: false
  local_correctness_is_paper_performance_evidence: false
  primary_hardware_measurements_required_for_timing_claims: true
  stage1_cb0_h0_performance_is_paper_evidence: false
  publication_requires_complete_expected_job_set: true
  publication_rejects_missing_failed_unexpected_or_conflicting_jobs: true
  paper_evidence_aliases_publication_ready: true
