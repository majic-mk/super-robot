protocol_version: 8
schema_version: 8
stage: v8_schema8_no_gpu_implementation
runtime_patch_mode: probekv_v8_gradual_barrier_tiered_lru

source_selection:
  metric: residual_k_pre_rope
  checkpoints: [1, 2]
  max_completed_depth: 2
  execution_policy: dense_selection_barrier
  source_freeze_is_final: true
  first_reuse_layer_if_all_d1: 2
  first_reuse_layer_if_any_d2: 3
  fast_path_candidates: [d1_only, d1_d2_rescue]
  fast_path_requires:
    - frozen_selection_depth_profile
    - frozen_repair_policy_profile
    - frozen_runtime_cost_profile
    - schema8_runtime_qualification
  fast_path_enables_only_after_pass:
    - dense_selection_barrier
    - d1_d2_detached_winner_prefetch
    - streamlined_final_commit_admission
    - request_layer_uniform_io_balanced_repair
  fallback_policy: legacy_multicheckpoint_three_gate
  fallback_mistral_checkpoints: [1, 2, 4, 5, 8]
  fallback_qwen_checkpoints: [1, 2, 4, 5, 7]
  fallback_requires_own_runtime_qualification: true
  per_request_protocol_mixing_forbidden: true

gate1:
  scope: source_local_optimistic_marginal_feasibility
  gamma: 1.0
  includes:
    - unavoidable_support_build_marginal_lower_bound
    - visible_load_marginal_lower_bound
    - repair_marginal_lower_bound
  excludes:
    - common_dense_repair_check_sunk_cost
    - base_transformer_compute
    - request_union_repair_kernel
    - request_aggregate_copy_critical_path
    - final_request_joint_admission

preparation_admission:
  economic_gate: false
  winner_only: true
  d1_frozen_winner_detached_prefetch_before_barrier: true
  prebarrier_prefetch_execution_visible: false
  prebarrier_final_commit_forbidden: true
  requires_logical_source_lease: true
  requires_physical_replica_lease: true
  requires_hbm_reservation: true

final_commit_admission:
  accounting: request_joint_critical_path
  gamma: 0.8
  actual_sunk_cost_required: true
  unresolved_segments: dense_fallback
  commit_irreversible: true
  barrier_closed_required: true
  ready_subset_incremental_commit: true

storage:
  artifact_policy: single_canonical_lossless
  backing_policy: cpu_preferred_single_backing
  lru_timestamp: one_last_request_use_epoch_per_exclusive_backing
  cpu_eviction: exclusive_backing_lru_demote_to_ssd
  ssd_eviction: exclusive_backing_lru_delete_source
  busy_replica_eviction_forbidden: true
  gpu_replica: transient_hot
  physical_transition_requires_verified_copy: true
  busy_state_source: logical_and_physical_lease_graph

repair_ratios:
  fixed_15: uniform_fixed
  static_gradual: shared_relative_schedule
  load_recompute_aware_gradual: per_segment_load_aware
  load_recompute_aware_uniform: request_layer_uniform_io_balanced
  adaptive_requires_frozen_profile: true
  adaptive_controller_scope: request_level_joint_ratio_vector
  independent_per_segment_adaptive_choice_forbidden: true
  adaptive_v1_search: bounded_profile_candidates
  timing_equivalence_absolute_ms: 0.02
  timing_equivalence_relative: 0.01
  timing_equivalent_choice: prefer_more_repair
  runtime_execution: joint_plan_drives_layerwise_no_reentry_support
  full_cartesian_ratio_oracle: development_only
  legacy_initial_cap: 0.15
  quality_reference_ratio: 0.15
  io_balance_ratio_candidates: [0.10, 0.12, 0.15, 0.20, 0.30, 0.50, 0.75, 1.0]
  io_balance_definition: max_frozen_profile_ratio_with_union_repair_not_slower_than_aggregate_load
  uniform_io_target: max_certified_quality_floor_and_io_balance_ratio
  uniform_io_first_layer: max_quality_reference_and_target
  uniform_io_later_layers: min_previous_ratio_and_current_target
  uniform_io_same_absolute_layer_all_active_segments: true
  reentry: none

compatibility:
  schema7_profiles_unlock_schema8: false
  schema7_gates_unlock_schema8: false
  legacy_a_c_configs_unchanged: true

experiments_h1_h5:
  H1_source_opportunity_and_correctness:
    purpose: prove_historical_source_choice_matters_before_optimizing_selector
    policies: [deep_full_candidate_oracle, legacy_multicheckpoint]
    outputs: [source_rsafe_spread, oracle_gain, r1_dense_equivalence]
    fast_path_required: false
  H2_depth_policy_and_dispatch:
    purpose: qualify_d1_only_or_d1_d2_or_select_legacy_fallback
    policies: [d1_only, d1_d2_rescue, legacy_multicheckpoint, deep_full_candidate_oracle]
    hard_metrics:
      state_availability_min: 0.99
      selection_coverage_min: 0.80
      early_resolution_rate_at_completed_depth5_min: 0.80
      wrong_early_lock_rate_max: 0.05
      mean_stable_normalized_oracle_regret_max: 0.10
      selection_critical_path_p95_fraction_max: 0.05
      selection_budget_realized_overrun_rate_max: 0.05
      illegal_lock_count_max: 0
      budget_admission_violation_count_max: 0
    decision: fast_selection_candidate_if_qualified_else_legacy_candidate
    output: h2_selection_candidate_not_final_runtime_dispatch
  H3_repair_quality:
    purpose: freeze_quality_floor_metric_and_repair_policy
    policies: [fixed_15, static_gradual, load_recompute_aware_uniform]
    fast_dispatch_policies: [fixed_15, static_gradual, load_recompute_aware_uniform]
    legacy_dispatch_policies: [fixed_15, static_gradual]
    uniform_io_under_legacy: diagnostic_only_not_runtime_eligible
    final_runtime_dispatch_after_profile_and_runtime_qualification: true
    operating_ratio_reference: 0.15
    endpoints: [0.0, 1.0]
    requirements: [task_noninferiority, tail_violation_bound, no_reentry_recall]
    dispatch_path_bound: true
  H4_systems_and_storage:
    purpose: validate_request_joint_admission_overlap_and_tier_management
    prerequisite: immutable_final_runtime_dispatch
    factors: [prefix_cache, multi_segment, gpu_cpu_ssd, lru, io_balance, concurrency]
    compare_runtime_contracts: [schema8_fast_path, legacy_three_gate]
    admitted_reuse_gamma: 0.8
  H5_locked_end_to_end:
    purpose: final_ttft_throughput_and_tail_evaluation
    prerequisites: [H1_pass, final_runtime_dispatch_frozen, H3_pass, H4_pass]
    baselines: [full, prefix_cache, cacheblend, cachecraft_cfo, legacy_probekv, oracle]
    locked_test_only_here: true
    selected_dispatch_path_only: true

no_gpu_gate:
  runtime_source_audit_required: true
  schema8_local_implementation_complete: true
  artifact_preparation_ready: true
  gpu_rental_ready_for_schema8_sentinel: true
  selector_depth_profile_frozen: false
  repair_policy_profile_frozen: false
  runtime_cost_profile_frozen: false
  gpu_runtime_qualified: false
  h1_h2_execution_allowed: false
  paper_evidence: false
  locked_test_accessed: false
  failures: []
