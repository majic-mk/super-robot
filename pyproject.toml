[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "probekv"
version = "0.1.0"
description = "Current-state-guided historical KV source selection research harness"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Research-only"}
authors = [{name = "ProbeKV Authors"}]

[project.scripts]
probekv = "probekv.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
